<div class="bColor"><h2 class="titleCustomer form">Register Customer</h2></div>

<form id="customerForm" class="form-horizontal" enctype="multipart/form-data" ng-submit="$ctrl.submitCustomerForm()">
  <div class="form-group formColor">
    <label class="col-sm-2 control-label">First Name</label>
    <div class="customer col-sm-6">
      <input class="form-control col-sm-4" ng-model="$ctrl.customer.firstName" name="firstName"
             ng-disabled="$ctrl.checked" maxlength="50" pattern="^[\x20-\x7F]+$" required />
      <span ng-show="customerForm.firstName.$error.required" class="help-block">First Name is required.</span>
    </div>
  </div>

  <div class="form-group formColor">
    <label class="col-sm-2 control-label">Last Name</label>
    <div class="customer col-sm-6">
      <input class="form-control col-sm-4" ng-model="$ctrl.customer.lastName" name="lastName"
             ng-disabled="$ctrl.checked" maxlength="50" pattern="^[\x20-\x7F]+$" required />
      <span ng-show="customerForm.lastName.$error.required" class="help-block">Last name is required.</span>
    </div>
  </div>

  <div class="form-group formColor">
    <label class="col-sm-2 control-label">Address</label>
    <div class="customer col-sm-6">
      <input class="form-control col-sm-4" ng-model="$ctrl.customer.address" name="address"
             ng-disabled="$ctrl.checked" maxlength="50" pattern="^[\x20-\x7F]+$" required/>
      <span ng-show="customerForm.address.$error.required" class="help-block">Address is required.</span>
    </div>
  </div>

  <div class="form-group formColor">
    <label class="col-sm-2 control-label">City</label>
    <div class="customer col-sm-6">
      <input class="form-control col-sm-4" ng-model="$ctrl.customer.city" name="city"
             ng-disabled="$ctrl.checked" maxlength="50" pattern="^[\x20-\x7F]+$" required/>
      <span ng-show="customerForm.city.$error.required" class="help-block">City is required.</span>
    </div>
  </div>

  <div class="form-group formColor">
    <label class="col-sm-2 control-label">Province</label>
    <div class="customer col-sm-6">
      <input class="form-control col-sm-4" ng-model="$ctrl.customer.province" name="province"
             ng-disabled="$ctrl.checked" maxlength="50" pattern="^[\x20-\x7F]+$" required/>
      <span ng-show="customerForm.province.$error.required" class="help-block">Province is required.</span>
    </div>
  </div>

  <div class="form-group formColor">
    <label class="col-sm-2 control-label">Telephone</label>
    <div class="customer col-sm-6">
      <input class="form-control col-sm-4" ng-model="$ctrl.customer.telephone" name="telephone"
             ng-disabled="$ctrl.checked" maxlength="50" pattern="^[\x20-\x7F]+$" required/>
      <span ng-show="customerForm.telephone.$error.required" class="help-block">Telephone is required.</span>
    </div>
  </div>

  <div class="form-group formColor">
    <div class="customer marg col-sm-6">
      <button id="newBtn" class="btn btn-default" type="submit" ng-disabled="customerForm.$invalid">Submit</button>
    </div>
  </div>

</form>
