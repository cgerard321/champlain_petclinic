spring.application.name=cart-service

stripe.secret.key=${STRIPE_API_SECRET_KEY:}
# Local Stripe CLI prints a whsec_ secret. Use that value, not the Dashboard production webhook secret:
# stripe listen --forward-to localhost:7008/api/v1/carts/webhook
stripe.webhook.secret.key=${STRIPE_WEBHOOK_SECRET_KEY:}

# Where Stripe sends the user back after checkout. Set these in .env for the deployed site.
frontend.customer-url=${CUSTOMER_FRONTEND_URL:http://localhost:3000}
frontend.employee-url=${EMPLOYEE_FRONTEND_URL:http://localhost:4200}
# The frontend sends its own address; it is used only if it matches this pattern
# (local dev, production, and every PR preview: petdev-<number>[-employee])
frontend.allowed-return-origins=${ALLOWED_RETURN_ORIGINS:http://localhost:(3000|4200)|https://petclinic(-emp-portal)?\\.benmusicgeek\\.synology\\.me|https://petdev-[0-9]+(-employee)?\\.benmusicgeek\\.synology\\.me}
