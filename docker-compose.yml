version: "3.9"

x-healthchecks:
  springboot: &springboot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health || curl -fsS http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  react-node: &react_node
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || true"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  angular-node: &angular_node
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4200/ || true"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  nginx: &nginx
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dbgate: &dbgate_hc
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mysql: &mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u${DB_USER}", "-p${DB_PASSWORD}", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres: &postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d images -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo: &mongo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u ${DB_USER} -p ${DB_PASSWORD} --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet -u ${DB_USER} -p ${DB_PASSWORD} --eval 'db.runCommand({ ping: 1 }).ok'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

services:
  petclinicFrontend:
    <<: *react_node
    image: petclinic-frontend
    container_name: petclinic-frontend
    profiles: ["fe"]
    build:
      context: ./petclinic-frontend
      dockerfile: Dockerfile
      args:
        - BUILD_MODE=development
    ports:
      - "3000:3000"
    volumes:
      - ./petclinic-frontend/src:/app/src
    env_file:
      - .env

  employeeFrontend:
    <<: *angular_node
    image: employee-frontend
    container_name: employee-frontend
    profiles: ["fe-employee"]
    build:
      context: ./employee-frontend
      dockerfile: Dockerfile
      args:
        - BUILD_MODE=development
    ports:
      - "4200:4200"
    volumes:
      - ./employee-frontend/src:/app/src
    env_file:
      - .env

  janus:
    <<: *nginx
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/njs:/etc/nginx/njs
    env_file:
      - .env

  visits-service-new:
    <<: *springboot
    build: visits-service-new
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-visits:
        condition: service_healthy
      mailer-service:
        condition: service_started

  inventory-service:
    <<: *springboot
    build: inventory-service
    hostname: inventory
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-inventory:
        condition: service_healthy

  vet-service:
    <<: *springboot
    build: vet-service
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-vet:
        condition: service_healthy
      postgres-vet:
        condition: service_healthy

  customers-service-reactive:
    <<: *springboot
    build: customers-service-reactive
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-customers:
        condition: service_healthy

  api-gateway:
    <<: *springboot
    build: api-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      customers-service-reactive:
        condition: service_healthy
      vet-service:
        condition: service_healthy
      visits-service-new:
        condition: service_healthy
      products-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy

  auth-service:
    <<: *springboot
    build: auth-service
    hostname: auth
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mysql-auth:
        condition: service_healthy
      mailer-service:
        condition: service_started

  billing-service:
    <<: *springboot
    build: billing-service
    hostname: billing
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-billing:
        condition: service_healthy

  products-service:
    <<: *springboot
    build: products-service
    hostname: products-service
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-products:
        condition: service_healthy

  cart-service:
    <<: *springboot
    build: cart-service
    hostname: cart
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongo-carts:
        condition: service_healthy

  mailer-service:
    build: mailer-service
    env_file:
      - .env
    environment:
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_DISPLAY_NAME=${SMTP_DISPLAY_NAME}

  files-service:
    build: files-service
    env_file:
      - .env
    environment:
      - FILE_DATABASE=${DB_USER}:${DB_PASSWORD}@tcp(mysql-files:3306)/files-db
      - FILE_ENDPOINT=minio:9100
      - FILE_ENV=dev
      - FILE_DEV_BUCKET=petclinic-dev
      - FILE_DEV_DATA=petclinic-bucket.benmusicgeek.synology.me
      - FILE_ACCESS_KEY_ID=${FILE_ACCESS_KEY_ID}
      - FILE_SECRET_ACCESS_KEY=${FILE_SECRET_ACCESS_KEY}
    depends_on:
      mysql-files:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server --address ":9100" --console-address ":9101" /data
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9101:9101"
    expose:
      - "9100"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 10

  mysql-files:
    <<: *mysql
    image: mysql:5.7
    platform: linux/amd64
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpwd}
      - MYSQL_DATABASE=files-db
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}

  mysql-auth:
    <<: *mysql
    image: mysql:5.7
    platform: linux/amd64
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpwd}
      - MYSQL_DATABASE=auth-db
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}

  postgres-vet:
    <<: *postgres
    image: postgres
    container_name: postgres-vet
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=images

  mongo-vet:
    <<: *mongo
    image: mongo
    container_name: mongo-vet
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  mongo-billing:
    <<: *mongo
    image: mongo
    container_name: mongo-billing
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  mongo-visits:
    <<: *mongo
    image: mongo
    container_name: mongo-visits
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  mongo-customers:
    <<: *mongo
    image: mongo
    container_name: mongo-customers
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  mongo-inventory:
    <<: *mongo
    image: mongo
    container_name: mongo-inventory
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  mongo-products:
    <<: *mongo
    image: mongo
    container_name: mongo-products
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  mongo-carts:
    <<: *mongo
    image: mongo
    container_name: mongo-carts
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}

  dev-tools:
    build:
      context: ./dev-tools
      dockerfile: Dockerfile
      args:
        pkg: dev-tools
    ports:
      - "4242:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MINIO_URL=petclinic-bucket.benmusicgeek.synology.me
      - DATABASE_URL=mysql://user:pwd@mysql-devtools:3306/devtools-db?ssl-mode=DISABLED
      - RUST_LOG=debug
      # In prod these will be in the stack.env file
      - PASSWORD_PEPPER=Ceramic1-Sultan-Zenith
      - ROCKET_SECRET_KEY=MEi/s8sSd6sbw+7acSBJv/Fk27+YL+/PAB8YZ25gydE=
      - DEFAULT_ADMIN_EMAIL=admin@admin.com
      - DEFAULT_ADMIN_PASSWORD=V1wjft2QXPUKYvLg
    env_file:
      - .env

  mysql-devtools:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      - MYSQL_ROOT_PASSWORD=rootpwd
      - MYSQL_DATABASE=devtools-db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pwd
