<div class="sql-results">
  <p class="sql-results__summary">{{ result().affectedRows }} row(s) affected</p>

  @if (result().columns.length > 0) {
    <div class="sql-results__scroll">
      <table mat-table [dataSource]="result().rows" class="sql-results__table">
        @for (column of result().columns; track column; let colIndex = $index) {
          <ng-container [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
            <td mat-cell *matCellDef="let row" [appTooltip]="row[colIndex]">
              {{ row[colIndex] }}
            </td>
          </ng-container>
        }
        <tr mat-header-row *matHeaderRowDef="result().columns"></tr>
        <tr mat-row *matRowDef="let row; columns: result().columns"></tr>
      </table>
    </div>
  }
</div>
