<div class="table-container" [class.stacked]="stackOnSmallScreens()">
  <table [attr.aria-label]="label()">
    <thead>
      <tr>
        @for (column of columns(); track column.id) {
          <th scope="col">{{ column.header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track rowId()(row)) {
        <tr>
          @for (column of columns(); track column.id) {
            <td [attr.data-label]="column.header">
              <div class="cell-content">
                @if (column.template; as cellTemplate) {
                  <ng-container
                    [ngTemplateOutlet]="cellTemplate"
                    [ngTemplateOutletContext]="{ $implicit: row }"
                  />
                } @else {
                  {{ column.value?.(row) }}
                }
              </div>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
