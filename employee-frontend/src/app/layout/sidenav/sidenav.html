<div class="sidenav-wrapper">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-icon">
      <mat-icon>pets</mat-icon>
    </div>
    <div class="brand-text">
      <div class="brand-title">Pet Clinic</div>
      <div class="brand-subtitle">Veterinary Care</div>
    </div>
  </div>

  <!-- Navigation List -->
  <mat-nav-list class="nav-list">
    @for (item of items; track item.route) {
      <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link" class="nav-item">
        <mat-icon matListItemIcon class="nav-icon">{{ item.icon }}</mat-icon>
        <span matListItemTitle class="nav-label">{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>

  <!-- Prototype Controls Footer -->
  <div class="prototype-controls">
    <div class="controls-title">PROTOTYPE CONTROLS</div>
    <label for="employeeNameInput" class="controls-label">Logged-in Employee:</label>
    <input id="employeeNameInput" type="text" [(ngModel)]="employeeName" class="controls-input" />
    <button (click)="applyNameChange()" class="controls-button">Apply Name Change</button>
  </div>
</div>
