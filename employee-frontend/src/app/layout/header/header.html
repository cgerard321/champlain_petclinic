<mat-toolbar color="primary">
  <span class="title">Petclinic</span>

  <ul class="horizontal-list">
    @for (navbarItem of navBarItems; track navbarItem.route) {
      <li>
        <a mat-list-item [routerLink]="navbarItem.route" routerLinkActive="active-link">
          <span matListItemTitle>{{ navbarItem.label }}</span>
        </a>
      </li>
    }
  </ul>

  <span class="spacer"></span>

  <div class="lang-switcher">
    <button mat-button (click)="switchLang('fr')">FR</button>
    <button mat-button (click)="switchLang('en')">EN</button>
  </div>

  <button mat-icon-button aria-label="Log out" (click)="logout()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
