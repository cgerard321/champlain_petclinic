<mat-toolbar color="primary">
  <span class="title">Champlain Petclinic</span>

  <ul class="horizontal-list">
    @for (navbarItem of navBarItems; track navbarItem.route) {
      <li>
        <a mat-list-item [routerLink]="navbarItem.route" routerLinkActive="active-link">
          <span matListItemTitle>{{ navbarItem.label }}</span>
        </a>
      </li>
    }
  </ul>

  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="username">
      {{ username() }}
    </div>

    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
