<!--
  VETS-CPC-1927: French is the source locale, written straight into this template.
  Every translatable element carries an i18n="@@id" attribute. The English text for each id
  lives in /i18n/en.json and is installed at startup by loadActiveTranslations
  (app.config.ts) when the saved language is 'en'.
-->
<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <span i18n="@@footer.brand">Portail Employé Clinique Vétérinaire</span>
      </div>

      <!-- Id convention: @@ then the module, then the key (e.g. @@footer.privacy) -->
      <div class="footer-links">
        <a href="#" class="footer-link" i18n="@@footer.privacy">Politique de confidentialité</a>
        <a href="#" class="footer-link" i18n="@@footer.terms">Conditions d'utilisation</a>
        <a href="#" class="footer-link" i18n="@@footer.support">Support</a>
      </div>

      <div class="footer-copyright">
        <p i18n="@@footer.copyright">&copy; 2026 Champlain Pet Clinic. Tous droits réservés.</p>
      </div>
    </div>
  </div>
</footer>
