<!--
  VETS-CPC-1927: francais = langue source, ecrite directement dans ce template.
  Chaque element traduisible a un attribut i18n="@@id". Le texte anglais pour
  chaque id vit dans /i18n/en.json et est charge au demarrage
  (provideAppInitializer dans app.config.ts) quand la langue sauvegardee est 'en'.
-->
<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <span i18n="@@footer.brand">Portail Employé Clinique Vétérinaire</span>
      </div>

      <!-- @@ = id, footer = module, puis la cle (ex: .privacy) -->
      <div class="footer-links">
        <a href="#" class="footer-link" i18n="@@footer.privacy">Politique de confidentialité</a>
        <a href="#" class="footer-link" i18n="@@footer.terms">Conditions d'utilisation</a>
        <a href="#" class="footer-link" i18n="@@footer.support">Support</a>
      </div>

      <div class="footer-copyright">
        <p i18n="@@footer.copyright">&copy; 2026 Champlain Pet Clinic. Tous droits réservés.</p>
      </div>
    </div>
  </div>
</footer>
