<!-- <app-coming-soon /> -->
<main class="visits-page" [class.visits-page--sidebar-hidden]="!isSidebarVisible()">
  @if (isSidebarVisible()) {
    <app-visit-sidebar
      [selectedStatuses]="selectedStatuses()"
      (hide)="hideSidebar()"
      (statusSelectionChange)="updateSelectedStatuses($event)"
    />
  }

  <section class="visits-page__content" aria-label="Visit list">
    @if (!isSidebarVisible()) {
      <button
        class="visits-page__show-sidebar"
        type="button"
        (click)="showSidebar()"
        i18n="@@visit.pages.buttonName"
      >
        Afficher les filtres
      </button>
    }
    <app-visit [selectedStatuses]="selectedStatuses()" />
  </section>
</main>
