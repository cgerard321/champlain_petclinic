<div class="error-wrapper">
  <div class="error-container">
    <h1>401</h1>
    <p>Sorry, you do not have permission to access this page or resource.</p>

    <form (submit)="handleAction($event)">
      <button type="submit">
        {{ hasToken ? 'Go Back Home' : 'Retry Log In' }}
      </button>
    </form>
  </div>
</div>
