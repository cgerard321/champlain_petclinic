@if (imageSrc(); as source) {
  <img class="product-thumbnail" [src]="source" [alt]="alt()" />
} @else {
  <div
    class="product-thumbnail-placeholder"
    aria-label="Aucune image de produit disponible"
    i18n-aria-label="@@products.image.unavailable"
    i18n="@@products.image.none"
  >
    Aucune image
  </div>
}
