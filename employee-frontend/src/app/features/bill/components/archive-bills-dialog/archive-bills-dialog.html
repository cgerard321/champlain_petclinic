<h2 mat-dialog-title i18n="@@bill.archiveDialog.title">Archivage des factures admissibles</h2>

<mat-dialog-content>
  <p i18n="@@bill.archiveDialog.content">
    Cette action permettra d'archiver toutes les factures payées admissibles créées il y a plus d’un
    an.
  </p>

  <p class="archive-note" i18n="@@bill.archiveDialog.note">
    Les factures impayées, les factures en retard et les factures plus récentes ne seront pas
    modifiées.
  </p>

  <p i18n="@@bill.archiveDialog.prompt">Voulez-vous continuer?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" i18n="@@bill.cancel" (click)="cancel()">Annuler</button>

  <button mat-flat-button type="button" i18n="@@bill.archiveDialog.confirm" (click)="confirm()">
    Confirmer l'archivage
  </button>
</mat-dialog-actions>
