
<h2 mat-dialog-title>Archive Eligible Bills</h2>

<mat-dialog-content>
  <p>
    This action will archive all eligible paid bills
    created more than one year ago.
  </p>

  <p class="archive-note">
    Unpaid bills, overdue bills, and newer bills will
    remain unchanged.
  </p>

  <p>
    Do you want to continue?
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()"
  >
    Cancel
  </button>

  <button
    mat-flat-button
    type="button"
    (click)="confirm()"
  >
    Confirm Archive
  </button>
</mat-dialog-actions>
