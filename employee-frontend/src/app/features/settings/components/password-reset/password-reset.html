<section class="password-block">
  <h3 class="block-title" i18n="@@settings.security.password.title">Mot de passe</h3>

  <p class="block-intro" i18n="@@settings.security.password.intro">
    Recevez un lien par courriel pour choisir un nouveau mot de passe.
  </p>

  <mat-form-field appearance="outline" class="email-field">
    <mat-label i18n="@@settings.security.password.label">Courriel</mat-label>
    <input
      #emailInput
      matInput
      type="email"
      autocomplete="email"
      spellcheck="false"
      [attr.aria-busy]="sending()"
      [attr.aria-invalid]="email().length > 0 && !emailValid()"
      [value]="email()"
      [disabled]="sending()"
      (input)="onType(emailInput.value)"
      (blur)="onBlur()"
    />
  </mat-form-field>

  <div class="send-row">
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="!canSend()"
      (click)="send()"
      i18n="@@settings.security.password.send"
    >
      Envoyer le lien
    </button>

    @if (cooldownRemaining() > 0) {
      <span class="cooldown">
        <span i18n="@@settings.security.password.retryIn">Nouvel envoi dans</span>&ngsp;
        {{ cooldownRemaining() }} s
      </span>
    }
  </div>

  <p class="field-note" role="status">{{ notice() }}</p>
</section>
