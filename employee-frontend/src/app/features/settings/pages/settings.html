<div class="settings-page">
  <div class="settings-header">
    <h1 class="settings-title" i18n="@@settings.title">Paramètres</h1>

    <button
      mat-icon-button
      type="button"
      aria-label="Fermer les paramètres"
      i18n-aria-label="@@settings.close"
      (click)="close()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-card class="settings-card">
    <div class="settings-body">
      <nav class="settings-nav">
        <button
          type="button"
          class="settings-nav-item"
          [class.is-active]="activeSection() === 'security'"
          [attr.aria-current]="activeSection() === 'security' ? 'page' : null"
          (click)="select('security')"
          i18n="@@settings.security.title"
        >
          Sécurité
        </button>

        <button
          type="button"
          class="settings-nav-item"
          [class.is-active]="activeSection() === 'display'"
          [attr.aria-current]="activeSection() === 'display' ? 'page' : null"
          (click)="select('display')"
          i18n="@@settings.display.title"
        >
          Affichage
        </button>
      </nav>

      <section class="settings-panel">
        <div [hidden]="activeSection() !== 'security'">
          <h2 class="settings-panel-title" i18n="@@settings.security.title">Sécurité</h2>
          <app-username-form />
        </div>

        <div [hidden]="activeSection() !== 'display'">
          <h2 class="settings-panel-title" i18n="@@settings.display.title">Affichage</h2>
          <app-display />
        </div>
      </section>
    </div>
  </mat-card>

  <div class="settings-actions">
    <button mat-button type="button" (click)="cancel()" i18n="@@settings.cancel">Annuler</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="!canSave()"
      (click)="save()"
      i18n="@@settings.save"
    >
      Enregistrer
    </button>
  </div>
</div>
